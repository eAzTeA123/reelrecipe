<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scroll2Cook">
  <!--
    Scroll2Cook: Bildmarke. Der Topf ist dasselbe Motiv wie im Ladezustand und
    im Onboarding.

    Bewusst randlos (full bleed): Android maskiert "any"-Icons selbst, iOS
    rundet apple-icon.png selbst. So genügt eine Zeichnung für Favicon, PWA,
    Startbildschirm und Navigationsleiste (dort per CSS gerundet).

    Die Zeichnung bleibt in der sicheren Zone (Mittelkreis 80 %), damit auch
    aggressiv maskierende Launcher nichts abschneiden.

    Die Farben stehen fest in der Datei, weil ein SVG, das als img oder Icon
    geladen wird, kein Stylesheet der App hat. Die Werte entsprechen den Tokens
    aus globals.css: Terrakotta c9472c (Akzent), Papier faf7f2 (Hintergrund),
    Schatten 8f2f1a (abgedunkelter Akzent für Tiefe). Näheres in DESIGN.md.
  -->
  <rect width="1024" height="1024" fill="#c9472c"/>

  <g id="art">
    <!-- Bodenschatten: verankert den Topf, wie in den Illustrationen -->
    <ellipse cx="512" cy="812" rx="252" ry="24" fill="#8f2f1a" opacity="0.35"/>

    <!-- Dampf: dieselbe Bewegung wie im Ladezustand -->
    <g fill="none" stroke="#faf7f2" stroke-width="28" stroke-linecap="round" opacity="0.85">
      <path d="M446 384 c-24,-32 24,-56 0,-88"/>
      <path d="M512 372 c-24,-34 24,-58 0,-92"/>
      <path d="M578 384 c-24,-32 24,-56 0,-88"/>
    </g>

    <!-- Deckel mit Knauf, schmaler als der Topf -->
    <rect x="424" y="436" width="176" height="58" rx="29" fill="#faf7f2"/>
    <circle cx="512" cy="426" r="24" fill="#faf7f2"/>

    <!-- Griffe -->
    <rect x="180" y="552" width="76" height="38" rx="19" fill="#faf7f2"/>
    <rect x="768" y="552" width="76" height="38" rx="19" fill="#faf7f2"/>

    <!-- Topfkorpus mit gerundetem Boden -->
    <path d="M248 496 H776 V636 A164 164 0 0 1 612 800 H412 A164 164 0 0 1 248 636 Z" fill="#faf7f2"/>
  </g>
</svg>
