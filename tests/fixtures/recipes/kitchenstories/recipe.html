<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Cremige Pilzpfanne | Kitchen Stories</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": "Cremige Pilzpfanne mit frischen Kräutern",
    "image": "https://images.kitchenstories.io/pilzpfanne.jpg",
    "recipeYield": "2 Portionen",
    "prepTime": "PT10M",
    "cookTime": "PT15M",
    "totalTime": "PT25M",
    "recipeIngredient": [
      "400 g gemischte Pilze (Champignons, Kräuterseitlinge)",
      "1 Schalotte",
      "1 Knoblauchzehe",
      "150 ml Sahne",
      "2 EL Olivenöl",
      "1 Bund Petersilie",
      "Salz und frisch gemahlener Pfeffer"
    ],
    "recipeInstructions": [
      {
        "@type": "HowToStep",
        "text": "Pilze putzen und in mundgerechte Stücke schneiden. Schalotte und Knoblauch fein würfeln."
      },
      {
        "@type": "HowToStep",
        "text": "Olivenöl in einer Pfanne erhitzen und die Pilze scharf anbraten, bis sie leicht gebräunt sind."
      },
      {
        "@type": "HowToStep",
        "text": "Schalotte und Knoblauch zugeben und kurz mitbraten."
      },
      {
        "@type": "HowToStep",
        "text": "Mit Sahne ablöschen, cremig einkochen lassen und mit gehackter Petersilie, Salz und Pfeffer abschmecken."
      }
    ]
  }
  </script>
</head>
<body>
  <h1>Cremige Pilzpfanne mit frischen Kräutern</h1>
</body>
</html>
