<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>One-Pot Pasta mit Tomaten und Spinat | Einfach Tasty</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": "One-Pot Pasta mit Tomaten und Spinat",
    "image": "https://images.einfachtasty.de/one-pot-pasta.jpg",
    "recipeYield": 3,
    "prepTime": "PT10M",
    "cookTime": "PT15M",
    "recipeIngredient": [
      "300 g Penne",
      "250 g Kirschtomaten",
      "150 g Babyspinat",
      "1 Zwiebel",
      "2 Knoblauchzehen",
      "750 ml Gemüsebrühe",
      "100 g Frischkäse",
      "Salz, Pfeffer und Oregano"
    ],
    "recipeInstructions": [
      {
        "@type": "HowToStep",
        "text": "Kirschtomaten halbieren, Zwiebel und Knoblauch fein hacken."
      },
      {
        "@type": "HowToStep",
        "text": "Nudeln, Tomaten, Zwiebeln und Knoblauch zusammen mit der Gemüsebrühe in einen großen Topf geben."
      },
      {
        "@type": "HowToStep",
        "text": "Aufkochen lassen und unter gelegentlichem Rühren bei mittlerer Hitze ca. 12 Minuten köcheln lassen."
      },
      {
        "@type": "HowToStep",
        "text": "Frischkäse und Spinat unterrühren, kurz zusammenfallen lassen und mit Salz, Pfeffer und Oregano abschmecken."
      }
    ]
  }
  </script>
</head>
<body>
  <h1>One-Pot Pasta mit Tomaten und Spinat</h1>
</body>
</html>
