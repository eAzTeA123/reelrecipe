<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Klassisches Bananenbrot | Springlane</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": "Saftiges Bananenbrot mit Walnüssen",
    "image": "https://images.springlane.de/bananenbrot.jpg",
    "recipeYield": "1 Kastenform",
    "prepTime": "PT15M",
    "cookTime": "PT55M",
    "totalTime": "PT70M",
    "recipeIngredient": [
      "3 reife Bananen",
      "200 g Dinkelmehl",
      "80 g weiche Butter",
      "70 g brauner Zucker",
      "2 Eier",
      "1 TL Backpulver",
      "1 Prise Zimt",
      "50 g gehackte Walnüsse"
    ],
    "recipeInstructions": [
      {
        "@type": "HowToStep",
        "text": "Backofen auf 175 °C Ober-/Unterhitze vorheizen und eine Kastenform einfetten."
      },
      {
        "@type": "HowToStep",
        "text": "Bananen mit einer Gabel gründlich zerdrücken."
      },
      {
        "@type": "HowToStep",
        "text": "Butter und braunen Zucker cremig schlagen, dann Eier und Bananenmus unterrühren."
      },
      {
        "@type": "HowToStep",
        "text": "Mehl, Backpulver und Zimt mischen, kurz unterrühren und die gehackten Walnüsse unterheben."
      },
      {
        "@type": "HowToStep",
        "text": "Teig in die Form füllen und ca. 50-55 Minuten goldbraun backen."
      }
    ]
  }
  </script>
</head>
<body>
  <h1>Saftiges Bananenbrot mit Walnüssen</h1>
</body>
</html>
