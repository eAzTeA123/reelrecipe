<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fluffy Buttermilk Pancakes Recipe | Allrecipes</title>
  <script type="application/ld+json">
  [
    {
      "@context": "https://schema.org",
      "@type": "Recipe",
      "name": "Fluffy Buttermilk Pancakes",
      "description": "Tall, fluffy, and delicious buttermilk pancakes.",
      "image": "https://www.allrecipes.com/thmb/fluffy-pancakes.jpg",
      "recipeYield": "4 servings",
      "prepTime": "PT15M",
      "cookTime": "PT15M",
      "totalTime": "PT30M",
      "recipeIngredient": [
        "2 cups all-purpose flour",
        "2 tablespoons sugar",
        "2 teaspoons baking powder",
        "1/2 teaspoon salt",
        "2 cups buttermilk",
        "2 large eggs",
        "1/4 cup unsalted butter, melted"
      ],
      "recipeInstructions": [
        {
          "@type": "HowToStep",
          "text": "Whisk flour, sugar, baking powder, and salt together in a large bowl."
        },
        {
          "@type": "HowToStep",
          "text": "Beat buttermilk, eggs, and melted butter together in a separate bowl."
        },
        {
          "@type": "HowToStep",
          "text": "Pour wet ingredients into dry ingredients and stir until just combined."
        },
        {
          "@type": "HowToStep",
          "text": "Heat a lightly oiled griddle over medium-high heat. Pour batter onto griddle and cook until bubbles form, then flip."
        }
      ]
    }
  ]
  </script>
</head>
<body>
  <h1>Fluffy Buttermilk Pancakes</h1>
</body>
