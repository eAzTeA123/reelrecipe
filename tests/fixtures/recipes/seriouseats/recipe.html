<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Crispy Roast Potatoes Recipe | Serious Eats</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": "The Best Crispy Roast Potatoes Ever",
    "image": "https://www.seriouseats.com/roast-potatoes.jpg",
    "recipeYield": 6,
    "prepTime": "PT20M",
    "cookTime": "PT50M",
    "totalTime": "PT70M",
    "recipeIngredient": [
      "2 kg russet or Yukon Gold potatoes",
      "1/2 cup extra-virgin olive oil",
      "1 small handful rosemary leaves, minced",
      "3 medium cloves garlic, minced",
      "Kosher salt and freshly ground black pepper"
    ],
    "recipeInstructions": [
      {
        "@type": "HowToStep",
        "text": "Adjust oven rack to center position and preheat oven to 450F / 230C."
      },
      {
        "@type": "HowToStep",
        "text": "Boil potatoes in salted water with baking soda until a knife meets no resistance."
      },
      {
        "@type": "HowToStep",
        "text": "Drain potatoes and rough up surfaces in the pot to create a starchy paste."
      },
      {
        "@type": "HowToStep",
        "text": "Toss with garlic-rosemary oil and roast on a large rimmed baking sheet for 50 minutes until deeply crispy."
      }
    ]
  }
  </script>
</head>
<body>
  <h1>The Best Crispy Roast Potatoes Ever</h1>
</body>
</html>
