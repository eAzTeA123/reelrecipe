<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Cremige Kürbissuppe Rezept | LECKER</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": "Cremige Kürbissuppe mit Kokosmilch",
    "image": "https://images.lecker.de/kuerbissuppe.jpg",
    "recipeYield": "4",
    "prepTime": "PT20M",
    "cookTime": "PT25M",
    "totalTime": "PT45M",
    "recipeIngredient": [
      "800 g Hokkaido-Kürbis",
      "1 Zwiebel",
      "1 Stück Ingwer (ca. 2 cm)",
      "2 EL Butter",
      "600 ml Gemüsebrühe",
      "200 ml Kokosmilch",
      "Salz und Pfeffer",
      "Etwas Muskatnuss"
    ],
    "recipeInstructions": [
      {
        "@type": "HowToSection",
        "name": "Zubereitung",
        "itemListElement": [
          {
            "@type": "HowToStep",
            "text": "Kürbis waschen, halbieren, entkernen und in Würfel schneiden."
          },
          {
            "@type": "HowToStep",
            "text": "Zwiebel und Ingwer schälen und fein hacken."
          },
          {
            "@type": "HowToStep",
            "text": "Butter in einem großen Topf zerlassen, Zwiebel und Ingwer darin glasig dünsten."
          },
          {
            "@type": "HowToStep",
            "text": "Kürbiswürfel zugeben, kurz mitdünsten und mit Gemüsebrühe ablöschen."
          },
          {
            "@type": "HowToStep",
            "text": "Zugedeckt etwa 20 Minuten köcheln lassen, bis der Kürbis weich ist."
          },
          {
            "@type": "HowToStep",
            "text": "Kokosmilch zugeben, die Suppe fein pürieren und mit Salz, Pfeffer und Muskat abschmecken."
          }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <h1>Cremige Kürbissuppe mit Kokosmilch</h1>
</body>
</html>
