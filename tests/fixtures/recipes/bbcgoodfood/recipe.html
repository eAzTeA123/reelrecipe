<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Easy Classic Scones | BBC Good Food</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": "Classic Scones",
    "image": "https://images.bbcgoodfood.com/scones.jpg",
    "recipeYield": "8",
    "prepTime": "PT15M",
    "cookTime": "PT10M",
    "totalTime": "PT25M",
    "recipeIngredient": [
      "350 g self-raising flour",
      "1 tsp baking powder",
      "85 g butter, cut into cubes",
      "3 tbsp caster sugar",
      "175 ml milk",
      "1 tsp vanilla extract",
      "Jam and clotted cream, to serve"
    ],
    "recipeInstructions": [
      {
        "@type": "HowToStep",
        "text": "Heat oven to 220C / 200C fan / gas 7. Tip flour and baking powder into a bowl with butter."
      },
      {
        "@type": "HowToStep",
        "text": "Rub butter in with your fingers until mixture looks like fine crumbs, then stir in sugar."
      },
      {
        "@type": "HowToStep",
        "text": "Warm milk gently and add vanilla extract. Stir into flour mixture to make a soft dough."
      },
      {
        "@type": "HowToStep",
        "text": "Roll out dough to 4cm thickness and stamp out rounds. Bake for 10 minutes until golden."
      }
    ]
  }
  </script>
</head>
<body>
  <h1>Classic Scones</h1>
</body>
</html>
